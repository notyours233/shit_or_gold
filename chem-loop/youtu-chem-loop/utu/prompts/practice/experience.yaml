SINGLE_QUERY_GROUP_ADVANTAGE_SP: |
  Your ultimate goal is to help improve the working agent's performance by extracting useful experiences from its past trajectories, which should focus on the learning objective and will be used in the future to guide the agent's behavior. The working agent and learning objective are defined as follows:
  <Working Agent Objective>
  {{ agent_objective }}
  </Working Agent Objective>
  <Learning Objective>
  {{ learning_objective }}
  </Learning Objective>

  Now, your task is to review the performance of the agent across multiple trajectories, and extract **chemistry micro-cards** that can be retrieved and reused later.

  IMPORTANT (ChemCouncil):
  - Chemistry knowledge is accumulated from many small, specific experiences ("micro-cards"), not a few vague principles.
  - We prefer many narrow-but-retrievable cards over one broad generic card.
  - Avoid generic process advice (e.g., "use weighted average", "do sanity checks") unless it is anchored to a specific chemistry case with concrete numbers.
  - The task input is material-name-centered. `material_name` is mandatory; synthesis, structure, composition, elements, contents, and conditions are optional.
  - Never invent absent optional fields. Use the exact material identity and whatever description is actually present.

  <Your Input>
  - Agent Input: [The specific input task that provided to the working agent, where reward ranges from 0 to 1 with 1 being the best]
  - Ground Truth (Optional): [If available, provide the ground truth answer to the agent input]
  - Trajectories: A JSON-like list of multiple trajectories, each representing an attempt by the agent to solve the input task.
  </Your Input>

  <Task Instructions>
  1. Evaluate each trajectory by comparing with the ground truth answers (if available) w.r.t. the learning objective:
    - Identify which responses are better and which are worse
    - Analyze the differences between successful and unsuccessful trajectories

  2. For bad responses:
    - Diagnose the root causes of failure (reasoning errors, knowledge gaps, misinterpretations, etc.)
    - Extract specific failure patterns and **chemistry details** needed for achieving the learning objective

  3. For good responses:
    - Identify the key success factors and effective strategies w.r.t. the learning objective
    - Document what made these approaches work well towards the learning objective

  4. Convert observations into chemistry micro-cards:
    - Each micro-card MUST be specific enough to be retrieved by similarity search from a future query.
    - Each micro-card MUST include:
      - task_type (one of the 19 registered directions)
      - the exact material_name and concise material-description anchors that are present
      - explicit elements, including nonmetals, only when available in INPUT_JSON or clearly present in the material formula/name
      - the metric key(s) or product being predicted (use the exact metrics_to_predict key spelling)
      - an anchor: either a GT numeric value/range (preferred) or a derived value/conversion with numbers
    - If the task is CO2RR product classification, include the product label and a short discriminating rationale (do NOT invent conditions).
    - If a condition is absent, omit it from CONTEXT and say in CAVEATS that the condition was not reported; never guess one.
    - Style requirement: each micro-card should read like **one paragraph** (NOT a slogan).
      Write at least 3 full sentences covering: context -> quantitative anchor -> explanation/heuristic -> how-to-use -> caveat.
    - Do NOT produce output-format rules (JSON, tags, key matching, <think>/<answer>, tool-calling rules). Those do not belong to the experience library.
  </Task Instructions>

  <Output Format>
  Include corresponding tags (e.g., <Experiences>...</Experiences>) as follows to organize the output:
  ```output
  <Learning Objective Focus>
    [briefly description on how to address learning objective, distinguishing it from the working agent's goal]
  </Learning Objective Focus>

  <Performance Assessment>
    - Good Responses: [List of good responses with brief justifications w.r.t. learning objective]
    - Bad Responses: [List of bad responses with brief justifications]
  </Performance Assessment>

  <Comparative Analysis>
    [Directly contrast the good and bad trajectories w.r.t. learning objective. Highlight the most critical factors that differentiated successful responses from unsuccessful ones. This should be a comparative analysis.]
  </Comparative Analysis>

  <Pattern Identification>
    [Key elements that led to success, and common pitfalls]
  </Pattern Identification>

  <Experiences>
    [Extract AT MOST **{{ num_experiences }}** micro-cards. Each card MUST be a SINGLE LINE string (no newlines) for downstream JSON parsing,
     but it should contain multiple sentences (a paragraph).]
    1. MaterialCard | TASK=...; MATERIAL=...; ELEMENTS=...; TARGET=...; ANCHOR=...; CONTEXT=...; TAKEAWAY=Sentence1. Sentence2. Sentence3.; HOW_TO_USE=...; CAVEATS=...; APPLIES=...
    2. MaterialCard | TASK=...; MATERIAL=...; ELEMENTS=...; TARGET=...; ANCHOR=...; CONTEXT=...; TAKEAWAY=Sentence1. Sentence2. Sentence3.; HOW_TO_USE=...; CAVEATS=...; APPLIES=...
    ...
  </Experiences>
  ```
  </Output Format>

