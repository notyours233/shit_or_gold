# =============
# System Configuration
# =============

# ===== LLM Configuration =====
llm:
  # Agent 1: GPT-5.5 via the shared OpenAI-compatible gateway + text-embedding-3-large
  agent1:
    provider: "openai"
    model: "gpt-5.5"
    api_key: "${OPENAI_API_KEY}"  
    base_url: "https://zenmux.dev/api/v1"
    temperature: 1.0
    max_tokens: 2000
    embedding_api_key: "${OPENROUTER_API_KEY}"
    embedding_model: "openai/text-embedding-3-large"
    emb_url: "https://openrouter.ai/api/v1/embeddings"
    embedding_provider: "openrouter"
  
  # Agent 2: DeepSeek V4 Pro via the shared OpenAI-compatible gateway + voyage-3-large
  agent2:
    provider: "deepseek"
    model: "deepseek-v4-pro"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://zenmux.dev/api/v1"
    temperature: 1.0
    max_tokens: 2000
    embedding_model: "voyage-3-large"    
    voyage_api_key: "${VOYAGE_API_KEY}"
    embedding_provider: "voyage" 
  
  # Agent 3: Gemini 3.5 Flash via the shared OpenAI-compatible gateway + gemini-embedding-001
  agent3:
    provider: "google"
    model: "gemini-3.5-flash"
    api_key: "${GOOGLE_API_KEY}"  
    base_url: "https://zenmux.dev/api/v1"
    temperature: 1.0
    max_tokens: 2000
    embedding_api_key: "${OPENROUTER_API_KEY}"
    embedding_model: "google/gemini-embedding-001"
    emb_url: "https://openrouter.ai/api/v1/embeddings"
    embedding_provider: "openrouter"
  
  # Agent 4: Qwen3.7-Max via the shared OpenAI-compatible gateway + text-embedding-v4
  agent4:
    # Chat model via the shared OpenAI-compatible gateway
    provider: "qwen"
    model: "qwen3.7-max"
    api_key: "${QWEN_API_KEY}"
    base_url: "https://zenmux.dev/api/v1"
    temperature: 1.0
    max_tokens: 2000
    # Embeddings use the same gateway and credential as the Qwen chat model
    embedding_api_key: "${QWEN_API_KEY}"
    embedding_model: "text-embedding-v4" 
    emb_url: "https://agent-team-api.myrimate.cn/v1/embeddings"
    embedding_provider: "bailian" 

# ===== Vector Store Configuration =====
vector_store:
  type: "chroma"
  persist_directory: "./data/chroma_db"
  reaction_persist_directory: "./data/chroma_db"
  collection_name: "literature"
  collection_names:
    material_property: "literature"
    reaction: "literature"
  distance_metric: "cosine"  # 'cosine, l2, ip'
  
# ===== RAG System Configuration =====
rag:
  chunk_size: 256  
  chunk_overlap: 50  
  top_k: 5  
  similarity_threshold: 0.8  
  
# ===== Debate Configuration =====
debate:
  max_rounds: 3  
  review_timeout: 600    
  rebuttal_timeout: 600  
  propose_timeout: 600
  timeout: 600  # Fallback 

  # Stalemate resolution: if max_rounds is reached and >1 proposal remains active,
  # deterministically pick a winner (no extra LLM calls) and produce a single final claim.
  resolve_stalemate: true
  stalemate_method: "score"  # currently supported: "score"
  stalemate_percent_tolerance: 0.05  # absolute tolerance when matching "X(12.34%)" floats
  stalemate_range_strategy: "conservative"  # conservative | mean

  # Auto-withdraw agents that repeatedly timeout / emit invalid JSON to avoid dragging the wall-clock.
  auto_withdraw_on_call_errors: true
  auto_withdraw_call_error_threshold: 2
  auto_withdraw_call_error_types: ["timeout", "invalid_json"]
  auto_withdraw_status: "withdrawn"

  # ReAct step budgets per phase 
  propose_max_react_steps: 5
  review_max_react_steps: 3
  rebuttal_max_react_steps: 4

  # LangGraph-style debate parameters 
  no_response_threshold: 1  # consecutive rounds failing to rebut valid reviews => defeated
  max_reviews_per_target: 2  # per reviewer per target proposal per round
  
# ===== Experience Store Configuration =====
experience:
  storage_path: "./data/experience_db.json"
  packs_path: "./experience"
  max_experiences: 1000  
  relevance_threshold: 0.4  
  enable_experience_reuse: true  
  # Experience retrieval strategy:
  # - jaccard: legacy component-overlap retrieval (fast, but can be too generic)
  # - vector: embed query + experiences and retrieve by cosine similarity
  search_mode: "vector"  # jaccard | vector
  # Embedding backend for vector search (env overrides supported):
  # - voyage: high-quality remote embeddings (requires VOYAGE_API_KEY)
  # - hash: deterministic local fallback for tests/offline
  embedding_provider: "voyage"  # voyage | hash
  embedding_model: "voyage-3-lite"
  embedding_hash_dim: 256
  # Optional cache path. Default prefers /state/experience_embed_cache.json (docker) or MAD/.cache.
  embedding_cache_path: ""
  guideline_top_k: 3
  always_include_guidelines: true
  guideline_search_mode: "keyword"
  
